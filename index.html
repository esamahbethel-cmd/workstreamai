<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Workstream AI | Outreach Command Center</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&family=Outfit:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <script src="wai_clients_data.js"></script>
  <script src="wai_partners_data.js"></script>
  <style>
    :root {
      --bg: #05050A; --surface: #0A0D14; --card: #121622; --border: #1F2538;
      --text: #F8FAFC; --muted: #94A3B8; --accent: #3B82F6;
      --gradient: linear-gradient(135deg, #3B82F6, #8B5CF6);
      --gradient2: linear-gradient(135deg, #F59E0B, #EF4444);
    }
    body { margin:0;padding:0;background:var(--bg);color:var(--text);font-family:'Outfit','DM Sans',sans-serif;-webkit-font-smoothing:antialiased }
    * { box-sizing:border-box }
    ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:#1F2538;border-radius:4px}
    button{font-family:inherit}button:disabled{opacity:.5;cursor:not-allowed}
    .btn-primary{background:var(--gradient);color:white;border:none;padding:14px 28px;border-radius:12px;font-weight:700;font-size:14px;cursor:pointer;transition:all .3s;box-shadow:0 4px 16px rgba(59,130,246,.2)}
    .btn-primary:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.4)}
    .btn-secondary{background:var(--card);color:var(--text);border:1px solid var(--border);padding:14px 28px;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
    .btn-secondary:not(:disabled):hover{background:var(--border)}
    .status-badge{padding:4px 12px;border-radius:100px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;display:inline-block}
    @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
    .animate-up{animation:fadeIn .4s cubic-bezier(.16,1,.3,1) forwards}
    .app-container{display:flex;min-height:100vh;background:var(--bg)}
    .sidebar{width:280px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;z-index:10}
    .sidebar-header{padding:32px 24px}
    .sidebar-nav{padding:0 16px;display:flex;flex-direction:column;gap:6px}
    .content-area{flex:1;padding:48px 64px;height:100vh;overflow-y:auto;overflow-x:hidden}
    .page-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:32px}
    .outreach-grid{display:grid;grid-template-columns:1fr 2fr;gap:32px}
    .desktop-table{display:table;width:100%;border-collapse:collapse}
    .mobile-cards{display:none}
    .pagination-bar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;background:var(--surface);border-top:1px solid var(--border)}
    .nav-item{border-radius:12px;cursor:pointer;display:flex;align-items:center;gap:12px;padding:12px 16px;transition:all .2s;font-size:15px}
    .nav-item:hover{background:rgba(255,255,255,.03)}
    .nav-divider{height:1px;background:var(--border);margin:12px 0}
    .tab-bar{display:flex;gap:4px;margin-bottom:20px;background:var(--surface);border-radius:12px;padding:4px;border:1px solid var(--border)}
    .tab-btn{flex:1;padding:10px 16px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;text-align:center}
    @media(max-width:850px){
      .app-container{flex-direction:column;height:100vh;overflow:hidden}
      .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border);padding-bottom:8px}
      .sidebar-header{padding:16px 20px;display:flex;align-items:center;gap:12px}
      .sidebar-header>div:nth-child(1){margin-bottom:0!important;width:32px!important;height:32px!important;font-size:16px!important}
      .sidebar-header>div:nth-child(3){display:none}
      .sidebar-nav{flex-direction:row;padding:8px 16px;overflow-x:auto;scrollbar-width:none}
      .sidebar-nav::-webkit-scrollbar{display:none}
      .nav-item{white-space:nowrap;font-size:14px!important;padding:10px 16px!important}
      .content-area{padding:24px 16px;height:auto;overflow-y:auto;padding-bottom:80px}
      .page-header{flex-direction:column;align-items:flex-start;gap:16px;margin-bottom:24px}
      .page-header h1{font-size:28px!important}
      .outreach-grid{grid-template-columns:1fr;gap:24px}
      .desktop-table{display:none}
      .mobile-cards{display:flex;flex-direction:column;gap:16px;padding:16px;background:var(--surface)}
      .mobile-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:20px}
      .pagination-bar{flex-direction:column;gap:16px;text-align:center;padding:20px 16px}
    }

    /* ═══ AUTH GATE STYLES ═══ */
    #auth-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;font-family:'Outfit',sans-serif}
    #auth-overlay.hidden{display:none}
    .abox{width:100%;max-width:380px;padding:20px;animation:afIn .6s ease}
    @keyframes afIn{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .a-icon{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(139,92,246,.08));border:2px solid rgba(59,130,246,.25);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:24px}
    .a-tag{font-size:9px;font-weight:700;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:6px;text-align:center}
    .a-h1{font-size:22px;font-weight:800;color:var(--text);text-align:center;margin:0}
    .a-sub{font-size:11px;color:var(--muted);margin-top:8px;text-align:center;line-height:1.5}
    .a-card{background:var(--card);border:1.5px solid var(--border);border-radius:14px;padding:24px;margin-top:24px;transition:border-color .3s}
    .a-card.err{border-color:rgba(239,68,68,.4)}
    .a-lbl{font-size:9px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:8px}
    .a-iw{position:relative;margin-bottom:16px}
    .a-inp{width:100%;padding:12px 44px 12px 14px;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-size:15px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:.15em;outline:none;box-sizing:border-box;transition:all .2s}
    .a-inp:focus{border-color:rgba(59,130,246,.5)}
    .a-inp:disabled{opacity:.5;background:rgba(239,68,68,.05)}
    .a-eye{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;padding:4px}
    .a-err{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:10px 12px;margin-bottom:14px;font-size:11px;color:#EF4444;font-weight:600;display:none}
    .a-err.vis{display:block}
    .a-lck{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:12px;margin-bottom:14px;text-align:center;display:none}
    .a-lck.vis{display:block}
    .a-lck-l{font-size:9px;font-weight:700;color:#EF4444;letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
    .a-lck-t{font-size:22px;font-weight:800;color:#EF4444;font-family:'JetBrains Mono',monospace}
    .a-btn{width:100%;padding:13px 0;border-radius:8px;border:none;background:var(--gradient);color:#fff;font-size:13px;font-weight:700;letter-spacing:.04em;cursor:pointer;text-transform:uppercase;transition:all .2s;font-family:'Outfit',sans-serif}
    .a-btn:disabled{background:var(--border);color:var(--muted);cursor:not-allowed}
    .a-btn:not(:disabled):hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(59,130,246,.3)}
    .a-dots{display:flex;justify-content:center;gap:4px;margin-top:10px}
    .a-dot{width:7px;height:7px;border-radius:50%;background:var(--border);transition:background .3s}
    .a-dot.x{background:#EF4444}
    .a-ft{text-align:center;margin-top:18px;font-size:8px;color:#1F2538;letter-spacing:.08em}
    .sb{display:flex;align-items:center;justify-content:space-between;padding:5px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:10px;font-family:'Outfit',sans-serif}
    .sb.hidden{display:none}
    .sb-l{display:flex;align-items:center;gap:8px}
    .sb-d{width:6px;height:6px;border-radius:50%;background:#10B981;box-shadow:0 0 6px rgba(16,185,129,.4)}
    .sb-n{color:var(--text);font-weight:700}
    .sb-b{font-size:8px;font-weight:700;padding:1px 5px;border-radius:3px;background:rgba(59,130,246,.1);color:var(--accent);border:1px solid rgba(59,130,246,.2);text-transform:uppercase;letter-spacing:.06em}
    .sb-r{display:flex;align-items:center;gap:10px}
    .sb-t{color:#1F2538}
    .sb-x{padding:2px 8px;border-radius:4px;border:1px solid rgba(239,68,68,.2);background:rgba(239,68,68,.08);color:#EF4444;font-size:9px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.04em;font-family:'Outfit',sans-serif}
    #root{display:none}

  </style>
</head>
<body>

  <div id="auth-overlay"><div class="abox">
    <div class="a-icon">🔒</div><div class="a-tag">WAI Outreach Engine</div>
    <h1 class="a-h1">Authorized Access Only</h1>
    <p class="a-sub">Enter your team access code to continue.</p>
    <div class="a-card" id="acard">
      <label class="a-lbl">Access Code</label>
      <div class="a-iw"><input type="password" id="apin" class="a-inp" placeholder="Enter access code" autofocus><button class="a-eye" id="aeye" onclick="aTP()">◎</button></div>
      <div class="a-err" id="aerr"></div>
      <div class="a-lck" id="alck"><div class="a-lck-l">Account Locked</div><div class="a-lck-t" id="alkt">00:00</div></div>
      <button class="a-btn" id="abtn" onclick="aSub()">Authenticate</button>
      <div class="a-dots" id="adots"></div>
    </div><div class="a-ft">WORKSTREAM AI · SECURED ACCESS</div>
  </div></div>
  <div class="sb hidden" id="sbar"><div class="sb-l"><div class="sb-d"></div><span style="color:var(--muted)">Logged in as <span class="sb-n" id="sname"></span></span><span class="sb-b hidden" id="sbadge">Admin</span></div><div class="sb-r"><span class="sb-t" id="stimer"></span><button class="sb-x" onclick="aOut()">Logout</button></div></div>

  <div id="root"></div>

  <script>
  var AU={users:[{name:"Bethel Esamah",pin:"WAI2026BE",role:"admin"},{name:"Timothy Lopas",pin:"WAI2026TL",role:"team"},{name:"Johanns Cordita",pin:"WAI2026JC",role:"team"}],sm:480,ma:5,lm:15};
  var aA=0,aLU=null,aLI=null,aSI=null,aSP=false;
  function aInit(){try{var s=JSON.parse(sessionStorage.getItem("aia_s"));if(s&&s.exp>Date.now()){aShow(s);return}}catch(e){}try{var lk=JSON.parse(sessionStorage.getItem("aia_lk"));if(lk&&lk.until>Date.now()){aLU=lk.until;aA=lk.a;aStartLk()}}catch(e){}document.getElementById("apin").addEventListener("keydown",function(e){if(e.key==="Enter")aSub()})}
  function aTP(){var i=document.getElementById("apin"),b=document.getElementById("aeye");aSP=!aSP;i.type=aSP?"text":"password";i.style.letterSpacing=aSP?"0.05em":"0.15em";b.textContent=aSP?"◉":"◎"}
  function aSub(){if(aLU&&aLU>Date.now())return;var p=document.getElementById("apin").value.trim(),u=AU.users.find(function(x){return x.pin===p});if(u){var s={name:u.name,role:u.role,at:Date.now(),exp:Date.now()+AU.sm*60000};sessionStorage.setItem("aia_s",JSON.stringify(s));sessionStorage.removeItem("aia_lk");aShow(s)}else{aA++;if(aA>=AU.ma){aLU=Date.now()+AU.lm*60000;sessionStorage.setItem("aia_lk",JSON.stringify({until:aLU,a:aA}));aErr("Locked for "+AU.lm+" minutes.");aStartLk()}else{aErr("Invalid code. "+(AU.ma-aA)+" attempts left.");aDots()}document.getElementById("apin").value=""}}
  function aErr(m){var e=document.getElementById("aerr");e.textContent="⚠ "+m;e.classList.add("vis");document.getElementById("acard").classList.add("err")}
  function aDots(){var e=document.getElementById("adots");e.innerHTML=Array.from({length:AU.ma}).map(function(_,i){return'<div class="a-dot '+(i<aA?"x":"")+'"></div>'}).join("")}
  function aStartLk(){var i=document.getElementById("apin");i.disabled=true;i.placeholder="Locked";document.getElementById("abtn").disabled=true;document.getElementById("alck").classList.add("vis");aLI=setInterval(function(){var r=Math.max(0,aLU-Date.now());if(r<=0){clearInterval(aLI);aLU=null;aA=0;sessionStorage.removeItem("aia_lk");i.disabled=false;i.placeholder="Enter access code";document.getElementById("abtn").disabled=false;document.getElementById("alck").classList.remove("vis");document.getElementById("adots").innerHTML="";document.getElementById("aerr").classList.remove("vis");document.getElementById("acard").classList.remove("err");return}var m=Math.ceil(r/60000),s=Math.ceil((r%60000)/1000);document.getElementById("alkt").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")},1000)}
  function aShow(s){document.getElementById("auth-overlay").classList.add("hidden");document.getElementById("root").style.display="block";document.getElementById("sbar").classList.remove("hidden");document.getElementById("sname").textContent=s.name;if(s.role==="admin")document.getElementById("sbadge").classList.remove("hidden");aUpT(s);aSI=setInterval(function(){aUpT(s)},30000)}
  function aUpT(s){var r=Math.max(0,s.exp-Date.now());if(r<=0){aOut();return}document.getElementById("stimer").textContent=Math.floor(r/3600000)+"h "+Math.floor((r%3600000)/60000)+"m"}
  function aOut(){sessionStorage.removeItem("aia_s");clearInterval(aSI);location.reload()}
  window.addEventListener("DOMContentLoaded",aInit);
  </script>

  <script type="text/babel">
    const { useState, useEffect } = React;

    /* ═══ SEGMENTS — CLIENT ICP ═══ */
    const CLIENT_SEGMENTS = {
      accounting:{label:"Accounting / Tax / Advisory",color:"#10B981",icon:"📊",titles:["Managing Partner","CEO","COO"],painPt:"partners reviewing the same types of work over and over, catching the same mistakes, while staff keeps producing first drafts that don't match the partner's standards or client-specific preferences"},
      wealth:{label:"Wealth Management / RIA",color:"#3B82F6",icon:"💼",titles:["CEO","Managing Director","Chief Investment Officer"],painPt:"advisors spending hours personalizing client communications and reviews when the AI could already know each client's preferences, history, and the advisor's decision-making style"},
      law:{label:"Law Firms",color:"#8B5CF6",icon:"⚖️",titles:["Managing Partner","COO","Director of Practice Management"],painPt:"associates producing first drafts that require extensive partner rework because they lack the context of the partner's preferences, client-specific standards, and historical decision patterns"},
      general:{label:"Professional Services",color:"#F59E0B",icon:"🏢",titles:["CEO","Managing Partner","COO"],painPt:"professionals spending too much time on repetitive first-pass work that could already reflect their standards, preferences, and client context before they ever touch it"},
    };

    /* ═══ SEGMENTS — BRAND PARTNERS ═══ */
    const PARTNER_SEGMENTS = {
      fintech:{label:"Fintech & Banking",color:"#059669",icon:"🏦",painPt:"expanding cross-border payment access and financial inclusion for the African diaspora"},
      travel:{label:"Travel & Relocation",color:"#2563EB",icon:"✈️",painPt:"growing diaspora travel, tourism, and relocation services across the African continent"},
      fashion:{label:"African Fashion & Lifestyle",color:"#EC4899",icon:"👗",painPt:"building global visibility for African luxury brands and cultural products"},
      realestate:{label:"Real Estate & Property",color:"#EF4444",icon:"🏠",painPt:"connecting diaspora investors with African property and land opportunities"},
      business:{label:"Business & Investment Education",color:"#F59E0B",icon:"📈",painPt:"educating and empowering African diaspora investors and entrepreneurs"},
      legal:{label:"Legal & Professional Services",color:"#8B5CF6",icon:"⚖️",painPt:"providing cross-border legal, tax, and advisory services for Africa-bound professionals"},
      diaspora:{label:"Diaspora Community Organizations",color:"#0891B2",icon:"🌍",painPt:"connecting and mobilizing the African diaspora for cultural, economic, and political engagement"},
      general:{label:"Other Partners",color:"#6366F1",icon:"🤝",painPt:"expanding African talent and brand visibility globally"},
    };

    /* ═══ SIZE TIERS ═══ */
    const SIZE_TIERS = {
      sme:{label:"SME (1-50)",color:"#10B981",icon:"🏪",desc:"Small & mid-size firms"},
      mme:{label:"MME (51-500)",color:"#F59E0B",icon:"🏛️",desc:"Mid-market enterprises"},
      bme:{label:"BME (500+)",color:"#8B5CF6",icon:"🏢",desc:"Large enterprises"},
    };

    /* ═══ OUTREACH GENERATORS — CLIENT (SIZE-AWARE) ═══ */
    const clientLinkedInDM = (lead) => {
       const s = CLIENT_SEGMENTS[lead.segment] || CLIENT_SEGMENTS.general;
       const sz = lead.size || "sme";
       const fname = lead.name.split(' ')[0];
       const ind = s.label.split(' /')[0].toLowerCase();
       if(sz==="bme") return `Hi ${fname},\n\nAt ${lead.company}'s scale, I imagine every engagement still flows through the same handful of senior people — and the gap between what staff produces and what partners expect creates constant rework cycles.\n\nWe're building personalized AI assistants for ${ind} firms. Each partner gets an agent that learns their preferences, client-specific needs, and decision-making patterns — so first-pass work arrives already tailored to their standards. Partners review instead of rework.\n\nFully on-premise, your data never leaves your environment. Would a 15-minute briefing be worth your time?`;
       if(sz==="mme") return `Hey ${fname},\n\nI work with ${ind} firms your size where the managing partners are still the quality bottleneck — reviewing everything, catching the same mistakes, reworking drafts that don't match their standards.\n\nWe build personalized AI assistants that learn each partner's preferences and produce first-pass work that's already tailored before a human touches it. Less rework, fewer repeated errors, more time for the work that actually matters.\n\nDeploys on your own infrastructure — full data sovereignty. Worth a 15-min look?`;
       return `Hey ${fname},\n\nAs a ${lead.title} at ${lead.company}, I bet you're still the one reviewing everything — and the first drafts you get back never quite match your standards or your clients' needs.\n\nWe build a personalized AI assistant that learns how YOU work — your preferences, your client-specific standards, your decision-making patterns. So the first pass you see is already 80% there, instead of starting from scratch.\n\nIt's not about replacing your judgment — it's about getting a first draft that actually reflects it. Open to a quick 10-min call?`;
    };

    const clientVoiceNote = (lead) => {
       const s = CLIENT_SEGMENTS[lead.segment] || CLIENT_SEGMENTS.general;
       const fname = lead.name.split(' ')[0];
       const sz = lead.size || "sme";
       const ind = s.label.split(' /')[0].toLowerCase();
       if(sz==="bme") return `[VOICE NOTE SCRIPT — Confident, executive tone]\n\n"Hi ${fname}, this is Tim Lopas from Workstream AI.\n\nI've been thinking about how firms like ${lead.company} handle the expertise bottleneck — the senior partners are the quality standard, but everything flows through them, creating rework cycles and slowing delivery.\n\nWe're building something different from generic AI tools. Each partner gets a personalized AI assistant that actually learns their preferences, their client-specific needs, their review patterns. So when work hits their desk, the first pass already reflects their standards — they review instead of rework.\n\nThe system deploys on your own infrastructure, fully transparent, your IT team has complete visibility. Would a 15-minute executive briefing make sense to see how this works? Let me know."\n\n[TIPS: Keep under 60 seconds. Executive peer tone. Emphasize on-premise security. End with specific ask.]`;
       if(sz==="mme") return `[VOICE NOTE SCRIPT — Confident, consultative tone]\n\n"Hey ${fname}, it's Tim from Workstream AI.\n\nI came across ${lead.company} and saw you're growing — which usually means the gap between what staff produces and what partners expect is getting wider. More rework, more repeated mistakes, more time reviewing instead of doing high-value work.\n\nWe build personalized AI assistants for ${ind} firms that learn each partner's preferences and produce first-pass work that's already tailored. Think of it as closing the gap between zero and one — AI handles the first draft, humans make the final call.\n\nWe recently helped a firm cut review cycles significantly in the first 60 days. Worth a 15-minute call to see if that applies to ${lead.company}? Let me know."\n\n[TIPS: Keep under 60 seconds. Confident but approachable. Use Tim's actual language about closing the gap between zero and one.]`;
       return `[VOICE NOTE SCRIPT — Warm, founder-to-founder tone]\n\n"Hey ${fname}, it's Tim from Workstream AI.\n\nI work with ${ind} firms where the managing partner is still the quality standard for everything — which means you're reviewing every deliverable, catching the same mistakes, and the work that hits your desk never quite matches what you'd produce yourself.\n\nWe build a personalized AI assistant that learns how you work — your preferences, your clients' needs, your decision-making patterns. So instead of starting from scratch every time, your first draft already reflects your standards.\n\nIt's not about taking anything away from you — it's about getting you a version that's significantly better than what you were originally handed. Want to see how it works in a quick 10-minute call? Let me know!"\n\n[TIPS: Keep under 60 seconds. Warm and relatable. Use Tim's exact quote about getting a significantly better version. End with specific ask.]`;
    };

    const clientNurture = (lead) => {
       const s = CLIENT_SEGMENTS[lead.segment] || CLIENT_SEGMENTS.general;
       const fname = lead.name.split(' ')[0];

    /* ═══ EDITABLE FIELD WITH CLICKABLE LINKS ═══ */
    function EditField({value,placeholder,onSave,type="text"}){

      const[val,setVal]=useState(value||"");
      useEffect(()=>{setVal(value||"")},[value]);
      if(editing)return <input autoFocus value={val} onChange={e=>setVal(e.target.value)} onBlur={()=>{setEditing(false);onSave(val)}} onKeyDown={e=>{if(e.key==="Enter"){setEditing(false);onSave(val)}if(e.key==="Escape"){setEditing(false);setVal(value||"")}}} placeholder={placeholder} style={{padding:"4px 8px",background:"var(--bg)",border:"1px solid var(--accent)",borderRadius:6,color:"var(--text)",fontSize:12,width:"100%",outline:"none",fontFamily:"inherit"}} />;
      if(!val)return <span onClick={()=>setEditing(true)} style={{cursor:"pointer",color:"var(--muted)",fontSize:12,fontWeight:400,borderBottom:"1px dashed var(--border)",paddingBottom:1}}>+ Add {placeholder}</span>;
      const href=type==="email"?`mailto:${val}`:val.startsWith("http")?val:`https://${val}`;
      const icon=type==="email"?"📧":val.includes("linkedin")?"🔗":"🌐";
      const display=val.replace(/^https?:\/\/(www\.)?/,'').replace(/\/$/,'').substring(0,28);
      return <span style={{display:"flex",alignItems:"center",gap:4}}>
        <a href={href} target="_blank" rel="noreferrer" style={{color:type==="email"?"#F59E0B":val.includes("linkedin")?"#0A66C2":"var(--accent)",textDecoration:"none",fontSize:12,fontWeight:600}} onClick={e=>e.stopPropagation()}>{icon} {display}</a>

      const [partnerPage,setPartnerPage]=useState(1);
      const [loading,setLoading]=useState(true);

      const detectClientSegment=(industry)=>{const i=(industry||"").toLowerCase();if(i.includes("account")||i.includes("tax")||i.includes("advisory")||i.includes("cpa")||i.includes("audit"))return"accounting";if(i.includes("wealth")||i.includes("ria")||i.includes("financial advis")||i.includes("investment advis"))return"wealth";if(i.includes("law")||i.includes("legal")||i.includes("attorney"))return"law";return"general"};
      const detectPartnerSegment=(category)=>{const c=(category||"").toLowerCase();if(c.includes("fintech")||c.includes("banking")||c.includes("bank")||c.includes("financ")||c.includes("payment")||c.includes("crypto"))return"fintech";if(c.includes("travel")||c.includes("reloc")||c.includes("airline")||c.includes("aviation")||c.includes("hotel")||c.includes("hospitality")||c.includes("tourism")||c.includes("tour"))return"travel";if(c.includes("fashion")||c.includes("lifestyle")||c.includes("music")||c.includes("media")||c.includes("entertain")||c.includes("culture")||c.includes("art")||c.includes("beauty"))return"fashion";if(c.includes("real estate")||c.includes("property")||c.includes("construct")||c.includes("housing")||c.includes("reit")||c.includes("land"))return"realestate";if(c.includes("business")||c.includes("investment education")||c.includes("venture")||c.includes("startup")||c.includes("entrepreneur")||c.includes("vc")||c.includes("tech news")||c.includes("accelerat")||c.includes("incubat"))return"business";if(c.includes("legal")||c.includes("law")||c.includes("professional")||c.includes("consult")||c.includes("advisory")||c.includes("tax")||c.includes("audit")||c.includes("account")||c.includes("insurance"))return"legal";if(c.includes("diaspora")||c.includes("community")||c.includes("association")||c.includes("sorority")||c.includes("fraternity")||c.includes("naacp")||c.includes("organization")||c.includes("network")||c.includes("festival")||c.includes("event")||c.includes("campaign")||c.includes("foundation")||c.includes("fellowship"))return"diaspora";return"general"};

      const parseCSV=(file,isPartner,cb)=>{Papa.parse(file,{header:true,skipEmptyLines:true,complete:function(r){const leads=[];r.data.forEach((row,i)=>{let name=row.Name||row["First Name"]?`${row["First Name"]||""} ${row["Last Name"]||""}`.trim():row.name;if(!name)name="Unknown";const title=row.Title||row.title||row["Job Title"]||"";const company=row.Company||row.company||row["Company Name"]||row.Organization||"";const location=row.Location||row.location||row["Company Location"]||row.Country||"Global";const website=row.Website||row.website||row["Company URL"]||row["Company Url"]||"";const linkedin=row.LinkedIn||row["LinkedIn Url"]||row["LinkedIn URL"]||row["Person Linkedin Url"]||row.linkedin||"";const email=row.Email||row.email||row["Person Email"]||"";const industry=row.Industry||row.industry||row.Category||row.category||"";const segment=isPartner?detectPartnerSegment(industry||row.Category||""):detectClientSegment(industry);leads.push({id:`csv-${Date.now()}-${i}`,name,title,company,location,website,linkedin,email,segment,status:row.Status||"New",signal:row["Hiring Signal"]||row.signal||"",reason:row["Reason This Is a Strong Lead"]||row.reason||""})});cb(leads)}})};

      /* ═══ SAVE TO LOCALSTORAGE ON EVERY CHANGE ═══ */
      useEffect(()=>{if(clientLeads.length>0)saveData("wai_clients",clientLeads)},[clientLeads]);
      useEffect(()=>{if(partnerLeads.length>0)saveData("wai_partners",partnerLeads)},[partnerLeads]);

      const handleUpload=(e,isPartner)=>{const file=e.target.files[0];if(!file)return;parseCSV(file,isPartner,(leads)=>{if(isPartner){setPartnerLeads(prev=>{const map=new Map();prev.forEach(l=>map.set((l.company||l.name).toLowerCase(),l));leads.forEach(l=>{const k=(l.company||l.name).toLowerCase();if(!map.has(k))map.set(k,l);else{const existing=map.get(k);map.set(k,{...existing,...l,status:existing.status!=="New"?existing.status:l.status,website:existing.website||l.website,linkedin:existing.linkedin||l.linkedin,email:existing.email||l.email})}});return Array.from(map.values())});setFilterSeg("all")}else{setClientLeads(prev=>{const base=prev.some(l=>!l.id.startsWith('csv-'))?[]:prev;const map=new Map();base.forEach(l=>map.set((l.company||l.name).toLowerCase(),l));leads.forEach(l=>{const k=(l.company||l.name).toLowerCase();if(!map.has(k))map.set(k,l)});return Array.from(map.values())});setFilterSeg("all")}})};

      const downloadCSV=(leads,filename)=>{const h=["Name","Title","Company","Location","Email","LinkedIn","Website","Segment","Status","Signal","Reason"];const rows=leads.map(l=>[l.name,l.title,l.company,l.location,l.email,l.linkedin,l.website,l.segment,l.status,l.signal||"",l.reason||""].map(v=>`"${(v||"").replace(/"/g,'""')}"`).join(","));const csv=[h.join(","),...rows].join("\n");const blob=new Blob([csv],{type:"text/csv"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;a.click()};

      const updateStatus=(setLeads,id,status)=>{setLeads(prev=>prev.map(l=>l.id===id?{...l,status}:l))};
      const updateField=(setLeads,id,field,value)=>{setLeads(prev=>prev.map(l=>l.id===id?{...l,[field]:value}:l))};

      const clearData=(key,setLeads)=>{if(confirm("Clear all data? This cannot be undone.")){localStorage.removeItem(key);setLeads([])}};

      /* ═══ INITIAL LOAD ═══ */
      useEffect(()=>{
        // Load clients: localStorage first, then CSV fallback, then mock
        const savedClients=loadData("wai_clients");
        if(savedClients&&savedClients.length>0){setClientLeads(savedClients);setLoading(false)}
        else{fetch('wai_dream_100.csv').then(r=>{if(!r.ok)throw new Error();return r.text()}).then(t=>{const file=new File([t],"leads.csv",{type:"text/csv"});parseCSV(file,false,(leads)=>{setClientLeads(leads);setLoading(false)})}).catch(()=>{setClientLeads(generateMockClients());setLoading(false)})}

        // Load clients from embedded data if no localStorage
        if(!savedClients||savedClients.length===0){
          if(typeof EMBEDDED_CLIENTS!=="undefined"&&EMBEDDED_CLIENTS.length>0){
            const embedded=EMBEDDED_CLIENTS.map((p,i)=>({id:p.id||`wai-${i}`,name:p.n,title:p.t,company:p.c,location:p.l,website:p.w||"",linkedin:p.li||"",email:p.e||"",segment:p.seg,size:p.sz||"sme",status:p.s||"New",signal:p.sig||"",reason:p.r||""}));
            setClientLeads(embedded);saveData("wai_clients",embedded);setLoading(false);
          }
        }

        // Load partners: localStorage first, then embedded data
        const savedPartners=loadData("wai_partners");
        if(savedPartners&&savedPartners.length>0){setPartnerLeads(savedPartners)}
        else{const embedded=loadEmbeddedPartners();if(embedded.length>0){setPartnerLeads(embedded);saveData("wai_partners",embedded)}}
      },[]);

      useEffect(()=>{const segs=view==="clients"?CLIENT_SEGMENTS:PARTNER_SEGMENTS;const leads=view==="clients"?clientLeads:partnerLeads;if(filterSeg==="all")view==="clients"?setFilteredClients(leads):setFilteredPartners(leads);else view==="clients"?setFilteredClients(leads.filter(l=>l.segment===filterSeg)):setFilteredPartners(leads.filter(l=>l.segment===filterSeg))},[filterSeg,clientLeads,partnerLeads,view]);

      useEffect(()=>{setFilterSeg("all");if(view==="clients"||view==="partners")setActiveLead(null)},[view]);

      if(loading)return<div style={{height:"100vh",display:"flex",alignItems:"center",justifyContent:"center",background:"var(--bg)"}}><div style={{textAlign:"center"}}><div style={{fontSize:48,marginBottom:16}}>🚀</div><h2 style={{margin:"0 0 8px"}}>Initializing Pipeline</h2><p style={{color:"var(--muted)"}}>Loading leads...</p></div></div>;

      const currentLeads=view==="clients"?filteredClients:filteredPartners;
      const currentSegs=view==="clients"?CLIENT_SEGMENTS:PARTNER_SEGMENTS;
      const isOutreach=view==="client-outreach"||view==="partner-outreach";

      return(
        <div className="app-container">
          <div className="sidebar">
            <div className="sidebar-header">
              <div style={{background:view.includes("partner")?"var(--gradient2)":"var(--gradient)",width:40,height:40,borderRadius:12,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,marginBottom:16}}>A</div>
              <div style={{fontSize:18,fontWeight:800}}>Workstream AI</div>
              <div style={{fontSize:11,color:"var(--muted)",textTransform:"uppercase",letterSpacing:".1em"}}>Outreach Command Center v1</div>
            </div>
            <div className="sidebar-nav">
              <div className="nav-item" onClick={()=>setView("clients")} style={{background:view==="clients"?"var(--card)":"transparent",color:view==="clients"?"var(--text)":"var(--muted)",fontWeight:view==="clients"?700:500}}>
                <span style={{fontSize:18}}>📁</span> WAI Prospects <span style={{marginLeft:"auto",fontSize:11,background:"var(--border)",padding:"2px 8px",borderRadius:100}}>{clientLeads.length}</span>
              </div>
              <div className="nav-item" onClick={()=>setView("client-outreach")} style={{background:view==="client-outreach"?"var(--card)":"transparent",color:view==="client-outreach"?"var(--text)":"var(--muted)",fontWeight:view==="client-outreach"?700:500}}>
                <span style={{fontSize:18}}>⚡</span> Prospect Outreach
              </div>
              <div className="nav-divider"/>
              <div className="nav-item" onClick={()=>setView("partners")} style={{background:view==="partners"?"var(--card)":"transparent",color:view==="partners"?"var(--text)":"var(--muted)",fontWeight:view==="partners"?700:500}}>
                <span style={{fontSize:18}}>🌍</span> Brand Partners <span style={{marginLeft:"auto",fontSize:11,background:"var(--border)",padding:"2px 8px",borderRadius:100}}>{partnerLeads.length}</span>
              </div>
              <div className="nav-item" onClick={()=>setView("partner-outreach")} style={{background:view==="partner-outreach"?"var(--card)":"transparent",color:view==="partner-outreach"?"var(--text)":"var(--muted)",fontWeight:view==="partner-outreach"?700:500}}>
                <span style={{fontSize:18}}>🤝</span> Partner Outreach
              </div>
            </div>
          </div>

          <div className="content-area">
            {/* ═══ CLIENT DATABASE ═══ */}
            {view==="clients"&&(
              <div className="animate-up">
                <div className="page-header">
                  <div><h1 style={{fontSize:36,margin:"0 0 8px"}}>Dream 100 — WAI Prospects</h1><p style={{color:"var(--muted)",margin:0,fontSize:16}}>Accounting, Wealth Management & Law Firm prospects <span style={{fontSize:11,color:"#10B981"}}>✓ Auto-saved</span></p></div>
                  <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
                    <label className="btn-secondary" style={{padding:"12px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,borderColor:"var(--accent)",color:"var(--accent)"}}><input type="file" accept=".csv" style={{display:"none"}} onChange={e=>handleUpload(e,false)}/><span>📥 Upload CSV</span></label>
                    <button onClick={()=>downloadCSV(filteredClients,`aia_clients_${new Date().toISOString().slice(0,10)}.csv`)} className="btn-secondary" style={{padding:"12px 20px",borderColor:"#10B981",color:"#10B981"}}>📤 Download</button>
                    <select value={filterSeg} onChange={e=>{setFilterSeg(e.target.value);setClientPage(1)}} style={{padding:"12px 16px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,color:"var(--text)",outline:"none",fontSize:14}}><option value="all">All ({clientLeads.length})</option>{Object.entries(CLIENT_SEGMENTS).map(([k,s])=><option key={k} value={k}>{s.icon} {s.label}</option>)}</select>
                  </div>
                </div>
                <LeadTable leads={filteredClients} segments={CLIENT_SEGMENTS} onSelectLead={ld=>{setActiveLead(ld);setActiveTrack("clients");setView("client-outreach")}} onUpdateStatus={(id,st)=>updateStatus(setClientLeads,id,st)} onUpdateField={(id,f,v)=>updateField(setClientLeads,id,f,v)} currentPage={clientPage} setCurrentPage={setClientPage}/>
              </div>
            )}

            {/* ═══ PARTNER DATABASE ═══ */}
            {view==="partners"&&(
              <div className="animate-up">
                <div className="page-header">
                  <div><h1 style={{fontSize:36,margin:"0 0 8px"}}>Brand Partners — Workstream AI</h1><p style={{color:"var(--muted)",margin:0,fontSize:16}}>Strategic brand partners <span style={{fontSize:11,color:"#10B981"}}>✓ Auto-saved</span></p></div>
                  <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",justifyContent:"flex-end"}}>
                    <label className="btn-secondary" style={{padding:"12px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:8,borderColor:"#F59E0B",color:"#F59E0B"}}><input type="file" accept=".csv" style={{display:"none"}} onChange={e=>handleUpload(e,true)}/><span>📥 Upload Partners CSV</span></label>
                    <button onClick={()=>downloadCSV(filteredPartners,`aia_partners_${new Date().toISOString().slice(0,10)}.csv`)} className="btn-secondary" style={{padding:"12px 20px",borderColor:"#10B981",color:"#10B981"}}>📤 Download</button>
                    <select value={filterSeg} onChange={e=>{setFilterSeg(e.target.value);setPartnerPage(1)}} style={{padding:"12px 16px",background:"var(--card)",border:"1px solid var(--border)",borderRadius:12,color:"var(--text)",outline:"none",fontSize:14}}><option value="all">All ({partnerLeads.length})</option>{Object.entries(PARTNER_SEGMENTS).map(([k,s])=><option key={k} value={k}>{s.icon} {s.label}</option>)}</select>
                  </div>
                </div>
                {partnerLeads.length===0?(
                  <div style={{textAlign:"center",padding:"60px 20px",border:"1px dashed var(--border)",borderRadius:16,color:"var(--muted)",background:"var(--card)"}}><div style={{fontSize:48,marginBottom:16}}>🌍</div><h3 style={{margin:"0 0 8px"}}>No Brand Partners Loaded</h3><p style={{margin:0,maxWidth:400,marginLeft:"auto",marginRight:"auto"}}>Upload a CSV with your Brand Partners Dream 100 list (African banks, hotels, airlines, construction, tourism ministries).</p></div>
                ):(<LeadTable leads={filteredPartners} segments={PARTNER_SEGMENTS} onSelectLead={ld=>{setActiveLead(ld);setActiveTrack("partners");setView("partner-outreach")}} onUpdateStatus={(id,st)=>updateStatus(setPartnerLeads,id,st)} onUpdateField={(id,f,v)=>updateField(setPartnerLeads,id,f,v)} currentPage={partnerPage} setCurrentPage={setPartnerPage}/>)}
              </div>
            )}

            {/* ═══ CLIENT OUTREACH ═══ */}
            {view==="client-outreach"&&(
              <div className="animate-up">
                <h1 style={{fontSize:32,margin:"0 0 8px"}}>Prospect Outreach Engine</h1>
                <p style={{color:"var(--muted)",margin:"0 0 32px",fontSize:16}}>LinkedIn DM + Voice Note + 4-Step Nurture for WAI prospects</p>
                {activeLead?<OutreachPanel lead={activeLead} track="clients" onClear={()=>{setActiveLead(null);setActiveTrack(null)}}/>:(
                  <div style={{textAlign:"center",padding:"60px 20px",border:"1px dashed var(--border)",borderRadius:16,color:"var(--muted)",background:"var(--card)"}}><div style={{fontSize:48,marginBottom:16}}>🎯</div><h3 style={{margin:"0 0 8px"}}>No Client Selected</h3><p style={{margin:0,maxWidth:400,marginLeft:"auto",marginRight:"auto"}}>Go to WAI Prospects and click "Write Scripts" on any lead.</p><button className="btn-primary" style={{marginTop:24,padding:"12px 24px"}} onClick={()=>setView("clients")}>Browse Clients</button></div>
                )}
              </div>
            )}

            {/* ═══ PARTNER OUTREACH ═══ */}
            {view==="partner-outreach"&&(
              <div className="animate-up">
                <h1 style={{fontSize:32,margin:"0 0 8px"}}>Partner Outreach Engine</h1>
                <p style={{color:"var(--muted)",margin:"0 0 32px",fontSize:16}}>LinkedIn DM + Voice Note + 4-Step Partnership Nurture</p>
                {activeLead?<OutreachPanel lead={activeLead} track="partners" onClear={()=>{setActiveLead(null);setActiveTrack(null)}}/>:(
                  <div style={{textAlign:"center",padding:"60px 20px",border:"1px dashed var(--border)",borderRadius:16,color:"var(--muted)",background:"var(--card)"}}><div style={{fontSize:48,marginBottom:16}}>🌍</div><h3 style={{margin:"0 0 8px"}}>No Partner Selected</h3><p style={{margin:0,maxWidth:400,marginLeft:"auto",marginRight:"auto"}}>Go to Brand Partners and click "Write Scripts" on any partner.</p><button className="btn-primary" style={{marginTop:24,padding:"12px 24px"}} onClick={()=>setView("partners")}>Browse Partners</button></div>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
